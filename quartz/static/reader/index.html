<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>読む — bananacide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="reader.css?v=a5172bba" />
  </head>
  <body data-mode="vertical" data-size="m">
    <header id="bar">
      <span id="work-title">読み込み中</span>
      <button id="toc-toggle" type="button" aria-expanded="false">目次</button>
      <button id="size-down" type="button" title="文字を小さく">小</button>
      <button id="size-up" type="button" title="文字を大きく">大</button>
      <button id="mode-toggle" type="button" title="縦書きと横書きを切り替える">横書き</button>
      <button id="theme-toggle" type="button" title="明暗を切り替える">暗</button>
      <a id="back" href="/works">作品ページ</a>
    </header>

    <div id="stage">
      <div id="viewport">
        <div id="flow"></div>
      </div>
    </div>

    <button class="turn" id="next" type="button" aria-label="次のページ">‹</button>
    <button class="turn" id="prev" type="button" aria-label="前のページ">›</button>

    <footer id="status">
      <span id="page-label"></span>
      <button id="back-note" type="button" hidden>本文へ戻る</button>
    </footer>

    <nav id="toc" hidden aria-label="目次">
      <p class="meta" id="toc-meta"></p>
      <ol id="toc-list"></ol>
    </nav>

    <div id="plate" hidden><img alt="" /></div>

    <div id="message">読み込み中……</div>

    <script src="reader.js?v=f519fffb"></script>
  </body>
</html>
